# =============================================================================
# quran_long_aya_r8_s10 -- 10% subsample of the LONG-aya Quran pronunciation LoRA.
#
#   Motivation (2026-09-27): the full 81,006-pair set's latent-cache step runs at
#   ~1.1 files/s on an L4 (~20 h), which does not fit a Colab session. This run
#   uses a frozen, seeded 10% subsample of the train COMBOS (both text variants
#   paired) -> 8,100 pairs, ~2 h cache, ~3.0 GiB dataset. It lands at the scale of
#   the working reference run (6,100 pairs). The full dataset and run identity
#   `quran_long_aya_r8` stay reserved for a future high-end-hardware attempt.
#
#   Subset built by sample_pron_dataset.py, seed 20260927; selection locked in
#   docs/quran_long_aya_s10_manifest.json. Identical to config/quran_long_aya_r8.yml
#   except:
#     1. name: quran_long_aya_r8_s10
#     2. log_dir: output/quran_long_aya_r8_s10/tensorboard
#     3. datasets[0].folder_path: /content/quran_long_aya_dataset_s10/train (8,100 pairs)
#     4. train.steps: 8100 (= 1 epoch at batch 1 x grad_accum 1)
#   Everything else is unchanged (rank 8/8 AR-only, lr 1e-4, adamw8bit, EMA 0.999,
#   cot off, ar_kl_weight 0.2, train_window_frames 0, bf16, quantisation).
# =============================================================================
---
job: "extension"
config:
  name: "quran_long_aya_r8_s10"
  process:
    - type: "diffusion_trainer"
      training_folder: "/content/ai-toolkit/output"
      sqlite_db_path: "/content/ai-toolkit/aitk_db.db"   # made absolute -- easier to target in the backup script below
      device: "cuda"
      trigger_word: ""   # blank -> nothing prepended (toolkit/prompt_utils.py:736-742). The pron captions have no trigger word by design.
      performance_log_every: 10
      network:
        type: "lora"
        linear: 8
        linear_alpha: 8
        conv: 16
        conv_alpha: 16
        lokr_full_rank: true
        lokr_factor: -1
        network_kwargs:
          ignore_if_contains: ["transformer.nar"]
      log_dir: "output/quran_long_aya_r8_s10/tensorboard"
      # log_dir is real (jobs/process/BaseTrainProcess.py) but writes into a
      # TIMESTAMPED SUBFOLDER under this path: output/quran_long_aya_r8_s10/tensorboard/quran_long_aya_r8_s10_<YYYYMMDD-HHMMSS>/
      log_config:
        log_every: 1   # dead key (toolkit/config_modules.py LoggingConfig) -- kept so nobody re-adds it
      save:
        dtype: "bf16"
        save_every: 1500
        max_step_saves_to_keep: 24
        save_format: "diffusers"
        push_to_hub: false
      datasets:
        - folder_path: "/content/quran_long_aya_dataset_s10/train"  # frozen 10% COMBOS sample (8,100 pairs); restore from gs://.../quran_long_aya_dataset_s10/ ; manifest docs/quran_long_aya_s10_manifest.json
          mask_path: null
          mask_min_value: 0.1
          default_caption: ""
          caption_ext: "txt"
          caption_dropout_rate: 0
          cache_latents_to_disk: true   # mandatory for YuE2; ~2 h for 8,100 files at the measured ~1.1 files/s on an L4
          is_reg: false
          network_weight: 1
          resolution:
            - 512
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 1
      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 8100   # 1 epoch: 8,100 pairs / (batch_size 1 x gradient_accumulation 1)
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        timestep_type: "sigmoid"
        content_or_style: "balanced"
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: false   # embedding-table lookup, ~free to recompute
        lr: 0.0001
        ema_config:
          use_ema: true
          ema_decay: 0.999
        skip_first_sample: false
        force_first_sample: false
        disable_sampling: true
        dtype: "bf16"
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "person"
        switch_boundary_every: 1
        loss_type: "mse"
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "Comfy-Org/YuE2/checkpoints/yue2_3b_int8_convrot.safetensors"
        quantize: true
        qtype: "convrot8"
        quantize_te: false
        qtype_te: "qfloat8"
        arch: "yue2"
        low_vram: false
        model_kwargs:
          cot: "off"
          abc_dropout: 0.5
          sample_ar_repetition_penalty: 1.2
          ar_kl_weight: 0.2
          train_window_frames: 0   # whole-clip; max_words=60 bounds the outliers
        compile: false
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 0
        width: 1024
        height: 1024
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 1
        sample_steps: 32
        num_frames: 1
        fps: 1
        duration: 360
meta:
  name: "[name]"
  version: "1.0"
