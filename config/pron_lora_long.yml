# =============================================================================
# pron_lora_long_r8 -- LONG-aya Quran pronunciation LoRA (multi-day run).
#
#   DRAFT for user approval. Nothing launches without you typing the command.
#   Derived from config/pron_lora_ar_only.yml (the Task-14 run) with ONLY the
#   changes the plan requires:
#     1. name: pron_lora_long_r8
#     2. log_dir: output/pron_lora_long_r8/tensorboard
#     3. datasets[0].folder_path: /content/quran_long_aya_dataset/train
#        (the FINAL quran set: min_words=6, max_words=60 -> 81,006 pairs)
#     4. train.steps: 81006 (= 1 epoch at batch 1 x grad_accum 1)
#     5. train.cache_text_embeddings: false  -- plan section 4: YuE2TextEncoder is
#        just an embedding lookup, so caching is ~free to recompute and would add
#        ~28-53 GiB + a per-VM rebuild. RECOMMENDED by the plan; flip to true to
#        match the reference run exactly.
#     6. save.save_every: 750  -- PROVISIONAL. Plan section 5.2: finalise after the
#        Phase-3 timing smoke as clamp(round(1800 / s_per_step), 100, 4000).
#     7. save.max_step_saves_to_keep: 12 (unchanged -- buffers the 5-min GCS mirror)
#   Everything else (rank 8/8 AR-only, lr 1e-4, adamw8bit, EMA 0.999, cot off,
#   ar_kl_weight 0.2, train_window_frames 0, bf16, quantisation) is identical to
#   pron_lora_ar_only.yml. Evidence: docs/PRON_LORA_VERIFICATION.md; runbook:
#   docs/PRON_LORA.md; plan: docs/PRON_LORA_LONG_PLAN.md.
# =============================================================================
---
job: "extension"
config:
  name: "pron_lora_long_r8"
  process:
    - type: "diffusion_trainer"
      training_folder: "/content/ai-toolkit/output"
      sqlite_db_path: "/content/ai-toolkit/aitk_db.db"   # made absolute -- easier to target in the backup script below
      device: "cuda"
      trigger_word: ""   # blank -> nothing prepended (toolkit/prompt_utils.py:736-742). The pron captions have no trigger word by design.
      performance_log_every: 10
      network:
        type: "lora"
        linear: 8
        linear_alpha: 8
        conv: 16
        conv_alpha: 16
        lokr_full_rank: true
        lokr_factor: -1
        network_kwargs:
          ignore_if_contains: ["transformer.nar"]
      log_dir: "output/pron_lora_long_r8/tensorboard"
      # log_dir is real (jobs/process/BaseTrainProcess.py) but writes into a
      # TIMESTAMPED SUBFOLDER under this path: output/pron_lora_long_r8/tensorboard/pron_lora_long_r8_<YYYYMMDD-HHMMSS>/
      log_config:
        log_every: 1   # dead key (toolkit/config_modules.py LoggingConfig) -- kept so nobody re-adds it
      save:
        dtype: "bf16"
        save_every: 750   # PROVISIONAL -- finalise after Phase-3 timing smoke (plan 5.2)
        max_step_saves_to_keep: 12
        save_format: "diffusers"
        push_to_hub: false
      datasets:
        - folder_path: "/content/quran_long_aya_dataset/train"  # FINAL long-aya quran set (81,006 pairs). Restore from gs://.../quran_long_aya_dataset/ -- NOT wired into setup.sh yet.
          mask_path: null
          mask_min_value: 0.1
          default_caption: ""
          caption_ext: "txt"
          caption_dropout_rate: 0
          cache_latents_to_disk: true   # mandatory for YuE2
          is_reg: false
          network_weight: 1
          resolution:
            - 512
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 1
      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 81006   # 1 epoch: 81,006 pairs / (batch_size 1 x gradient_accumulation 1). Plan section 7 option A.
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        timestep_type: "sigmoid"
        content_or_style: "balanced"
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: false   # plan section 4: embedding-table lookup, ~free to recompute; avoids ~28-53 GiB cache + rebuild
        lr: 0.0001
        ema_config:
          use_ema: true
          ema_decay: 0.999
        skip_first_sample: false
        force_first_sample: false
        disable_sampling: true
        dtype: "bf16"
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "person"
        switch_boundary_every: 1
        loss_type: "mse"
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "Comfy-Org/YuE2/checkpoints/yue2_3b_int8_convrot.safetensors"
        quantize: true
        qtype: "convrot8"
        quantize_te: false
        qtype_te: "qfloat8"
        arch: "yue2"
        low_vram: false
        model_kwargs:
          cot: "off"
          abc_dropout: 0.5
          sample_ar_repetition_penalty: 1.2
          ar_kl_weight: 0.2
          train_window_frames: 0   # whole-clip; the 145-word outliers are excluded by max_words=60, so no crop needed
        compile: false
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 0
        width: 1024
        height: 1024
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 1
        sample_steps: 32
        num_frames: 1
        fps: 1
        duration: 360
meta:
  name: "[name]"
  version: "1.0"
