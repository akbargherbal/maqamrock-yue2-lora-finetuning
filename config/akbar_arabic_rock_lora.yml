---
job: "extension"
config:
  name: "akbar_arabic_rock_lora"
  process:
    - type: "diffusion_trainer"
      training_folder: "/content/ai-toolkit/output"
      sqlite_db_path: "/content/ai-toolkit/aitk_db.db"   # made absolute -- easier to target in the backup script below
      device: "cuda"
      trigger_word: "arabmaqamrock"   # v2 captions now bake this in directly ("arabmaqamrock " prefix); AI Toolkit's injector only prepends when the trigger appears zero times in the caption (toolkit/prompt_utils.py), so this is a no-op, not a double-prepend -- keep it set
      performance_log_every: 10
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
        conv: 16
        conv_alpha: 16
        lokr_full_rank: true
        lokr_factor: -1
        network_kwargs:
          ignore_if_contains: []
      # TensorBoard event log -- a stable, well-known format an AI agent can parse
      # directly (tensorboard.backend.event_processing.event_accumulator) without
      # needing to know aitk_db.db's internal schema. Seen in other users' exported
      # configs, not primary docs -- confirm it's honored for diffusion_trainer/yue2
      # before relying on it.
      log_dir: "output/akbar_arabic_rock_lora/tensorboard"
      # NOTE (verified against ai-toolkit source, see DECISIONS.md): log_dir is real
      # and generic (jobs/process/BaseTrainProcess.py), but it writes into a
      # TIMESTAMPED SUBFOLDER under this path, not this path directly --
      # output/akbar_arabic_rock_lora/tensorboard/akbar_arabic_rock_lora_<YYYYMMDD-HHMMSS>/.
      # log_config below is NOT read anywhere in toolkit/config_modules.py's LoggingConfig
      # -- it's a dead key, left over from an example config. Only `logging.log_every`
      # below (already set) controls anything. Kept here, not deleted, so nobody re-adds
      # it later thinking it's missing.
      log_config:
        log_every: 1
      save:
        dtype: "bf16"
        save_every: 250
        max_step_saves_to_keep: 12   # was 4 -- widened so the background GCS sync (every 15 min, backup_to_gcp.py default) has a buffer before local rotation deletes older checkpoints
        save_format: "diffusers"
        push_to_hub: false
      datasets:
        - folder_path: "/content/yue2_dataset"  # downloaded fresh into /content/ each Colab session via bootstrap/setup.sh's job_dataset(), backed up by backup_to_gcp.py
          mask_path: null
          mask_min_value: 0.1
          default_caption: ""
          caption_ext: "txt"
          caption_dropout_rate: 0
          cache_latents_to_disk: true   # correct -- mandatory for YuE2
          is_reg: false
          network_weight: 1
          resolution:
            - 512
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 1
      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 3000   # deliberate leave-alone for v2: one-variable discipline -- v2's only intended change vs. v1 is caption content (lyrics), so step count stays fixed to keep the comparison clean.
        # Wall-clock cost: don't reuse the killed run's ~7.8s/step (that was measured under the
        # 60s train_window_frames, not whole-song). Measured whole-song A100 step-time instead:
        # see docs/GPU_L4_VS_A100.md (~3.10 s/step A100 vs ~13.4 s/step L4, ~4.3x).
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        timestep_type: "sigmoid"
        content_or_style: "balanced"   # confirmed honored -- traced to the generic timestep sampler in BaseSDTrainProcess.py; a separate axis from train_window_frames below, left alone by design
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: true   # was false -- your captions are static per file, so this is close-to-free speed with no quality cost
        lr: 0.0001
        ema_config:
          use_ema: true    # was false -- community YuE2 LoRA trainers specifically credit ema_decay:0.999 for reducing run-to-run variance
          ema_decay: 0.999
        skip_first_sample: false
        force_first_sample: false
        disable_sampling: false
        dtype: "bf16"
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "person"
        switch_boundary_every: 1
        loss_type: "mse"
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "Comfy-Org/YuE2/checkpoints/yue2_3b_int8_convrot.safetensors"
        quantize: true
        qtype: "convrot8"
        quantize_te: false
        qtype_te: "qfloat8"
        arch: "yue2"
        low_vram: false
        model_kwargs:
          cot: "off"   # was "full" -- your captions carry no melodic/ABC info, so this skips SheetSage2 entirely (faster caching + training); switch back to "full" if you want the LoRA to shape melodic structure, not just style/timbre
          abc_dropout: 0.5   # moot while cot:"off" -- only relevant if you switch cot back to "full"
          sample_ar_repetition_penalty: 1.2
          ar_kl_weight: 0.2
          # NEW, was unset (implicit default 1500 = 60s). Verified against yue2_model.py's
          # condition_noisy_latents(): every step was cropping ONE random 60s window out of the
          # cached full-song latents and computing BOTH the NAR flow loss and the AR next-token
          # loss (loss/ar_ce -- confirmed the dominant term in TRAINING_ANALYSIS) on that window
          # only. Fine for a pure timbre/style adapter; wrong for a full-song-structure goal,
          # since the AR expert never once saw a gradient spanning a verse->chorus transition.
          # 0 = whole song, no cropping (condition_noisy_latents no-ops when window<=0). Safe per
          # verification.md: dataset max is 370s, well inside the ~983s AR context ceiling
          # (CONTEXT 24576 / 25fps), and the VAE's "60s chunks" are only an offline encode-time
          # memory trick (src/vae.py encode()) -- cached latents are one contiguous per-song
          # tensor, so a larger window isn't crossing any real boundary.
          # VERIFIED: whole-song (this setting) ran cleanly to 3000/3000 steps on both L4 and
          # A100 in the v1 run, peak VRAM ~15-16GB, no OOM. No fallback-window logic needed.
          train_window_frames: 0
        compile: false
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 0
        width: 1024   # vestigial from the image template, harmless
        height: 1024
        samples:
          # Four held-out lyric prompts (one per maqam, own maqam's own text), v2 caption format
          # with a [Lyrics] block -- clean of the 267 training captions (see INFERENCE/yue2_eval_heldout/
          # heldout_eval_report.md). Duration 360s so a sample can actually show pronunciation,
          # not just style/timbre, at any checkpoint from sample_every:250 on.
          - prompt: "arabmaqamrock Symphonic cinematic orchestral ballad, hymn-like grand concert hall acoustics, heavy rock instrumentation, stately groove, 110 BPM. Maqam Hijaz. deep male vocals, mixed-voice chest-head resonance blend on sustained notes, breath-supported melismatic runs, controlled vibrato, full-voiced commanding presence, precise Arabic diction, melismatic phrasing in Maqam Hijaz with unhurried phrase-ending sustains. Audiophile recording, punchy centered mix, forward vocals pulling instrumentation down on sustained phrases then band re-enters between lines, bright presence, clean transients, large dynamic range, natural breath room between phrases. Distorted electric guitars, orchestral strings, weighted acoustic rock drums, tight rhythm section. Mood: Poignant, Chivalric, Emotional.\n[Lyrics]\n[Intro]\nلَبَّيْتَ صَوْتًا زِبَطْرِيًّا هَرَقْتَ لَهُ\nكَأْسَ الْكَرَى وَرُضَابَ الْخُرَّدِ الْعُرُبِ...\n\n[Verse 1]\nلَبَّيْتَ صَوْتًا زِبَطْرِيًّا هَرَقْتَ لَهُ\nكَأْسَ الْكَرَى وَرُضَابَ الْخُرَّدِ الْعُرُبِ...\nعَدَاكَ حَرُّ الثُّغُورِ الْمُسْتَضَامَةِ عَنْ\nبَرْدِ الثُّغُورِ وَعَنْ سَلْسَالِهَا الْحَصِبِ...\n\n[Chorus]\nأَجَبْتَهُ مُعْلِنًا بِالسَّيْفِ مُنْصَلِتًا\nوَلَوْ أَجَبْتَ بِغَيْرِ السَّيْفِ لَمْ تُجِبِ...\nحَتَّى تَرَكْتَ عَمُودَ الشِّرْكِ مُنْعَفِرًا\nوَلَمْ تُعَرِّجْ عَلَى الْأَوْتَادِ وَالطُّنُبِ...\n\n[Verse 2]\nلَمَّا رَأَى الْحَرْبَ رَأْيَ الْعَيْنِ تُوفِلِسٌ\nوَالْحَرْبُ مُشْتَقَّةُ الْمَعْنَى مِنَ الْحَرَبِ...\nغَدَا يُصَرِّفُ بِالْأَمْوَالِ جِرْيَتَهَا\nفَعَزَّهُ الْبَحْرُ ذُو التَّيَّارِ وَالْحَدَبِ...\nهَيْهَاتَ زُعْزِعَتِ الْأَرْضُ الْوَقُورُ بِهِ\nعَنْ غَزْوِ مُحْتَسِبٍ لَا غَزْوِ مُكْتَسِبِ...\nلَمْ يُنْفِقِ الذَّهَبَ الْمُرْبِي بِكَثْرَتِهِ\nعَلَى الْحَصَى وَبِهِ فَقْرٌ إِلَى الذَّهَبِ...\nإِنَّ الْأُسُودَ أُسُودَ الْغَيْلِ هِمَّتُهَا\nيَوْمَ الْكَرِيهَةِ فِي الْمَسْلُوبِ لَا السَّلَبِ...\n\n[Chorus]\nأَجَبْتَهُ مُعْلِنًا بِالسَّيْفِ مُنْصَلِتًا\nوَلَوْ أَجَبْتَ بِغَيْرِ السَّيْفِ لَمْ تُجِبِ...\nحَتَّى تَرَكْتَ عَمُودَ الشِّرْكِ مُنْعَفِرًا\nوَلَمْ تُعَرِّجْ عَلَى الْأَوْتَادِ وَالطُّنُبِ...\n\n[Outro]\nإِنَّ الْأُسُودَ أُسُودَ الْغَيْلِ هِمَّتُهَا\nيَوْمَ الْكَرِيهَةِ فِي الْمَسْلُوبِ لَا السَّلَبِ..."
          - prompt: "arabmaqamrock Symphonic cinematic orchestral ballad, hymn-like grand concert hall acoustics, heavy rock instrumentation, stately groove, 110 BPM. Maqam Kurd. deep male vocals, mixed-voice chest-head resonance blend on sustained notes, breath-supported melismatic runs, controlled vibrato, full-voiced commanding presence, precise Arabic diction, melismatic phrasing in Maqam Kurd with unhurried phrase-ending sustains. Audiophile recording, punchy centered mix, forward vocals pulling instrumentation down on sustained phrases then band re-enters between lines, bright presence, clean transients, large dynamic range, natural breath room between phrases. Distorted electric guitars, orchestral strings, weighted acoustic rock drums, tight rhythm section. Mood: tense, ominous, lethal, dramatic.\n[Lyrics]\n[Intro]\nفَوَرَدْنَ وَالْعَيُّوقُ مَقْعَدَ رَابِئِ الضُّرَبَاءِ...\nفَوْقَ النَّظْمِ لَا يَتَتَلَّعُ...\n\n[Verse 1]\nفَوَرَدْنَ وَالْعَيُّوقُ مَقْعَدَ رَابِئِ الضُّرَبَاءِ...\nفَوْقَ النَّظْمِ لَا يَتَتَلَّعُ...\nفَشَرَعْنَ فِي حَجَرَاتِ عَذْبٍ بَارِدٍ\nحَصِبِ الْبِطَاحِ تَغِيبُ فِيهِ الْأَكْرُعُ...\nفَشَرِبْنَ ثُمَّ سَمِعْنَ حِسًّا دُونَهُ\nشَرَفُ الْحِجَابِ وَرَيْبَ قَرْعٍ يُقْرَعُ...\nوَنَمِيمَةً مِنْ قَانِصٍ مُتَلَبِّبٍ\nفِي كَفِّهِ جَشْءٌ أَجَشُّ وَأَقْطُعُ...\n\n[Chorus]\nفَنَكِرْنَهُ فَنَفَرْنَ وَامْتَرَسَتْ بِهِ\nسَطْعَاءُ هَادِيَةٌ وَهَادٍ جُرْشُعُ...\nفَرَمَى فَأَنْفَذَ مِنْ نَجُودٍ عَائِطٍ\nسَهْمًا فَخَرَّ وَرِيشُهُ مُتَصَمِّعُ...\n\n[Verse 2]\nفَبَدَا لَهُ أَقْرَابُ هَذَا رَائِغًا\nعَجِلًا فَعَيَّثَ فِي الْكِنَانَةِ يُرْجِعُ...\nفَرَمَى فَأَلْحَقَ صَاعِدِيًّا مِطْحَرًا\nبِالْكَشْحِ فَاشْتَمَلَتْ عَلَيْهِ الْأَضْلُعُ...\n\n[Verse 3]\nفَأَبَدَّهُنَّ حُتُوفَهُنَّ فَهَارِبٌ\nبِذَمَائِهِ أَوْ بَارِكٌ مُتَجَعْجِعُ...\nيَعْثُرْنَ فِي حَدِّ الظُّبَاتِ كَأَنَّمَا\nكُسِيَتْ بُرُودَ بَنِي يَزِيدَ الْأَذْرُعُ...\n\n[Outro]\nيَعْثُرْنَ فِي حَدِّ الظُّبَاتِ كَأَنَّمَا\nكُسِيَتْ بُرُودَ بَنِي يَزِيدَ الْأَذْرُعُ..."
          - prompt: "arabmaqamrock Symphonic cinematic orchestral ballad, hymn-like grand concert hall acoustics, heavy rock instrumentation, stately groove, 110 BPM. Maqam Nahawand. deep male vocals, mixed-voice chest-head resonance blend on sustained notes, breath-supported melismatic runs, controlled vibrato, full-voiced commanding presence, precise Arabic diction, melismatic phrasing in Maqam Nahawand with unhurried phrase-ending sustains. Audiophile recording, punchy centered mix, forward vocals pulling instrumentation down on sustained phrases then band re-enters between lines, bright presence, clean transients, large dynamic range, natural breath room between phrases. Distorted electric guitars, orchestral strings, weighted acoustic rock drums, tight rhythm section. Mood: nostalgic, faithful, solemn hope.\n[Lyrics]\n[Intro]\nبِاللهِ يَا مَنْزِلَ الْعَيْشِ ٱلَّذِي دَرَسَتْ\nآثَارُهُ وَعَفَتْ مُذْ بِنْتُ أَرْبُعُهُ...\n\n[Verse 1]\nبِاللهِ يَا مَنْزِلَ الْعَيْشِ ٱلَّذِي دَرَسَتْ\nآثَارُهُ وَعَفَتْ مُذْ بِنْتُ أَرْبُعُهُ...\nهَلِ الزَّمَانُ مُعِيدٌ فِيكَ لَذَّتَنَا\nأَمِ ٱلَّيَالِي ٱلَّتِي أَمْضَتْهُ تُرْجِعُهُ...\nفِي ذِمَّةِ اللهِ مَنْ أَصْبَحْتَ مَنْزِلَهُ\nوَجَادَ غَيْثٌ عَلَى مَغْنَاكَ يُمَرِّعُهُ...\nمَنْ عِنْدَهُ لِيَ عَهْدٌ لَا يَضِيعُ كَمَا\nعِنْدِي لَهُ عَهْدُ صِدْقٍ لَا أُضَيِّعُهُ...\nوَمَنْ يُصَدِّعُ قَلْبِي ذِكْرُهُ وَإِذَا\nجَرَى عَلَى قَلْبِهِ ذِكْرِي يُصَدِّعُهُ...\nلَأَصْبِرَنَّ لِدَهْرٍ لَا يُمَتِّعُنِي\nبِهِ وَلَا بِيَ فِي حَالٍ يُمَتِّعُهُ...\n\n[Chorus]\nعِلْمًا بِأَنَّ اصْطِبَارِي مُعْقِبٌ فَرَجًا\nفَأَضْيَقُ الْأَمْرِ إِنْ فَكَّرْتَ أَوْسَعُهُ...\nعَسَى ٱلَّيَالِي ٱلَّتِي أَضْنَتْ بِفُرْقَتِنَا\nجِسْمِي سَتَجْمَعُنِي يَوْمًا وَتَجْمَعُهُ...\n\n[Verse 2]\nوَإِنْ تُغِلَّ أَحَدًا مِنَّا مَنِيَّتُهُ\nلَا بُدَّ فِي غَدِهِ الثَّانِي سَيَتْبَعُهُ...\n\n[Chorus]\nعِلْمًا بِأَنَّ اصْطِبَارِي مُعْقِبٌ فَرَجًا\nفَأَضْيَقُ الْأَمْرِ إِنْ فَكَّرْتَ أَوْسَعُهُ...\nعَسَى ٱلَّيَالِي ٱلَّتِي أَضْنَتْ بِفُرْقَتِنَا\nجِسْمِي سَتَجْمَعُنِي يَوْمًا وَتَجْمَعُهُ...\n\n[Outro]\nوَإِنْ تُغِلَّ أَحَدًا مِنَّا مَنِيَّتُهُ\nلَا بُدَّ فِي غَدِهِ الثَّانِي سَيَتْبَعُهُ..."
