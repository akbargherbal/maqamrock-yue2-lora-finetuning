---
job: "extension"
config:
  name: "akbar_arabic_rock_lora"
  process:
    - type: "diffusion_trainer"
      training_folder: "/content/ai-toolkit/output"
      sqlite_db_path: "/content/ai-toolkit/aitk_db.db"   # made absolute -- easier to target in the backup script below
      device: "cuda"
      trigger_word: "arabmaqamrock"   # was null -- set explicitly since your dataset captions have none baked in; AI Toolkit auto-prepends this at train time
      performance_log_every: 10
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
        conv: 16
        conv_alpha: 16
        lokr_full_rank: true
        lokr_factor: -1
        network_kwargs:
          ignore_if_contains: []
      # TensorBoard event log -- a stable, well-known format an AI agent can parse
      # directly (tensorboard.backend.event_processing.event_accumulator) without
      # needing to know aitk_db.db's internal schema. Seen in other users' exported
      # configs, not primary docs -- confirm it's honored for diffusion_trainer/yue2
      # before relying on it.
      log_dir: "output/akbar_arabic_rock_lora/tensorboard"
      # NOTE (verified against ai-toolkit source, see DECISIONS.md): log_dir is real
      # and generic (jobs/process/BaseTrainProcess.py), but it writes into a
      # TIMESTAMPED SUBFOLDER under this path, not this path directly --
      # output/akbar_arabic_rock_lora/tensorboard/akbar_arabic_rock_lora_<YYYYMMDD-HHMMSS>/.
      # log_config below is NOT read anywhere in toolkit/config_modules.py's LoggingConfig
      # -- it's a dead key, left over from an example config. Only `logging.log_every`
      # below (already set) controls anything. Kept here, not deleted, so nobody re-adds
      # it later thinking it's missing.
      log_config:
        log_every: 1
      save:
        dtype: "bf16"
        save_every: 250
        max_step_saves_to_keep: 12   # was 4 -- widened so the background GCS sync (every ~5 min) has a buffer before local rotation deletes older checkpoints
        save_format: "diffusers"
        push_to_hub: false
      datasets:
        - folder_path: "/content/yue2_dataset"  # downloaded fresh into /content/ each Colab session -- see colab_gcs_backup.sh
          mask_path: null
          mask_min_value: 0.1
          default_caption: ""
          caption_ext: "txt"
          caption_dropout_rate: 0
          cache_latents_to_disk: true   # correct -- mandatory for YuE2
          is_reg: false
          network_weight: 1
          resolution:
            - 512
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 1
      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 3000   # revisit -- 267 clips at num_repeats:1 means this sees each clip only a handful of times; consider raising substantially (see earlier note on dataset size vs. steps).
        # Also: the killed run's ~7.8s/step and ~6h ETA (TRAINING_ANALYSIS) were measured under
        # the 60s train_window_frames, not the whole-song window above -- don't reuse that ETA.
        # Recompute from the smoke test's actual s/step before trusting this step count's wall-clock cost.
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        timestep_type: "sigmoid"
        content_or_style: "balanced"   # unconfirmed whether this field is honored under yue2's schema -- worth checking
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: true   # was false -- your captions are static per file, so this is close-to-free speed with no quality cost
        lr: 0.0001
        ema_config:
          use_ema: true    # was false -- community YuE2 LoRA trainers specifically credit ema_decay:0.999 for reducing run-to-run variance
          ema_decay: 0.999
        skip_first_sample: false
        force_first_sample: false
        disable_sampling: false
        dtype: "bf16"
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "person"
        switch_boundary_every: 1
        loss_type: "mse"
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "Comfy-Org/YuE2/checkpoints/yue2_3b_int8_convrot.safetensors"
        quantize: true
        qtype: "convrot8"
        quantize_te: false
        qtype_te: "qfloat8"
        arch: "yue2"
        low_vram: false
        model_kwargs:
          cot: "off"   # was "full" -- your captions carry no melodic/ABC info, so this skips SheetSage2 entirely (faster caching + training); switch back to "full" if you want the LoRA to shape melodic structure, not just style/timbre
          abc_dropout: 0.5   # moot while cot:"off" -- only relevant if you switch cot back to "full"
          sample_ar_repetition_penalty: 1.2
          ar_kl_weight: 0.2
          # NEW, was unset (implicit default 1500 = 60s). Verified against yue2_model.py's
          # condition_noisy_latents(): every step was cropping ONE random 60s window out of the
          # cached full-song latents and computing BOTH the NAR flow loss and the AR next-token
          # loss (loss/ar_ce -- confirmed the dominant term in TRAINING_ANALYSIS) on that window
          # only. Fine for a pure timbre/style adapter; wrong for a full-song-structure goal,
          # since the AR expert never once saw a gradient spanning a verse->chorus transition.
          # 0 = whole song, no cropping (condition_noisy_latents no-ops when window<=0). Safe per
          # verification.md: dataset max is 370s, well inside the ~983s AR context ceiling
          # (CONTEXT 24576 / 25fps), and the VAE's "60s chunks" are only an offline encode-time
          # memory trick (src/vae.py encode()) -- cached latents are one contiguous per-song
          # tensor, so a larger window isn't crossing any real boundary.
          # UNVERIFIED ON THIS HARDWARE: this was not evaluated on an actual L4 run before the
          # kill/relaunch decision. Current 60s-window run peaked ~16GB/23GB VRAM at ~7.8s/step;
          # whole-song (up to ~6x the frames on the longest clips) will cost materially more of
          # both. Smoke-test a handful of steps on the longest clips first -- if VRAM or
          # step-time blows the budget, fall back to a bounded window (e.g. 4000-6000 frames,
          # ~2.5-4 min) rather than 0, which still buys far more structure than 60s did.
          train_window_frames: 0
        compile: false
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 0
        width: 1024   # vestigial from the image template, harmless
        height: 1024
        samples:
          # Style-only prompts mirroring your actual training captions (no [Lyrics] block) --
          # the stock "Laura Training" demo song was a different input shape than what this LoRA trains on.
          - prompt: "arabmaqamrock, Symphonic cinematic orchestral ballad, hymn-like grand concert hall acoustics, heavy rock instrumentation, stately groove, 110 BPM. Maqam Hijaz. Male deep baritone, mixed-voice chest-head resonance blend on sustained notes, breath-supported melismatic runs, controlled vibrato, full-voiced commanding presence, precise Arabic diction, melismatic phrasing in Maqam Hijaz with unhurried phrase-ending sustains. Audiophile recording, punchy centered mix, forward vocals pulling instrumentation down on sustained phrases then band re-enters between lines, bright presence, clean transients, large dynamic range, natural breath room between phrases. Distorted electric guitars, orchestral strings, weighted acoustic rock drums, tight rhythm section. Mood: melancholic, longing, nostalgic."
          - prompt: "arabmaqamrock, Symphonic cinematic orchestral ballad, hymn-like grand concert hall acoustics, heavy rock instrumentation, stately groove, 110 BPM. Maqam Kurd. Male deep baritone, mixed-voice chest-head resonance blend on sustained notes, breath-supported melismatic runs, controlled vibrato, full-voiced commanding presence, precise Arabic diction, melismatic phrasing in Maqam Kurd with unhurried phrase-ending sustains. Audiophile recording, punchy centered mix, forward vocals pulling instrumentation down on sustained phrases then band re-enters between lines, bright presence, clean transients, large dynamic range, natural breath room between phrases. Distorted electric guitars, orchestral strings, weighted acoustic rock drums, tight rhythm section. Mood: solemn, severe, authoritative."
          - prompt: "arabmaqamrock, Symphonic cinematic orchestral ballad, hymn-like grand concert hall acoustics, heavy rock instrumentation, stately groove, 110 BPM. Maqam Nahawand. Male deep baritone, mixed-voice chest-head resonance blend on sustained notes, breath-supported melismatic runs, controlled vibrato, full-voiced commanding presence, precise Arabic diction, melismatic phrasing in Maqam Nahawand with unhurried phrase-ending sustains. Audiophile recording, punchy centered mix, forward vocals pulling instrumentation down on sustained phrases then band re-enters between lines, bright presence, clean transients, large dynamic range, natural breath room between phrases. Distorted electric guitars, orchestral strings, weighted acoustic rock drums, tight rhythm section. Mood: triumphant, heroic, uplifting."
          - prompt: "arabmaqamrock, Symphonic cinematic orchestral ballad, hymn-like grand concert hall acoustics, heavy rock instrumentation, stately groove, 110 BPM. Maqam Ajam. Male deep baritone, mixed-voice chest-head resonance blend on sustained notes, breath-supported melismatic runs, controlled vibrato, full-voiced commanding presence, precise Arabic diction, melismatic phrasing in Maqam Ajam with unhurried phrase-ending sustains. Audiophile recording, punchy centered mix, forward vocals pulling instrumentation down on sustained phrases then band re-enters between lines, bright presence, clean transients, large dynamic range, natural breath room between phrases. Distorted electric guitars, orchestral strings, weighted acoustic rock drums, tight rhythm section. Mood: reverent, majestic, grand."
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 1
        sample_steps: 32
        num_frames: 1
        fps: 1
        duration: 120
meta:
  name: "[name]"
  version: "1.0"
